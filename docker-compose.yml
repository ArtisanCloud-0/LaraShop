services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: larashop-app

        env_file:
            - .env

        ports:
            - "8080:10000"

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: larashop
            DB_USERNAME: larashop
            DB_PASSWORD: secret

            FILESYSTEM_DISK: public

            RUN_MIGRATIONS: "true"

        depends_on:
            mysql:
                condition: service_healthy

        restart: unless-stopped

    mysql:
        image: mysql:8.4

        container_name: larashop-mysql

        environment:
            MYSQL_DATABASE: larashop
            MYSQL_USER: larashop
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: rootsecret

        ports:
            - "3307:3306"

        volumes:
            - larashop_mysql_data:/var/lib/mysql

        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-prootsecret",
                ]
            interval: 5s
            timeout: 5s
            retries: 20

        restart: unless-stopped

volumes:
    larashop_mysql_data:
