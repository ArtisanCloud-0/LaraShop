services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: larashop-app

        ports:
            - "8080:10000"

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080

            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/database/database.sqlite

            FILESYSTEM_DISK: public

            RUN_MIGRATIONS: "true"
            RUN_SEEDERS: "true"

        restart: unless-stopped
